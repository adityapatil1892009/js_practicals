<!DOCTYPE html>
<html>
<head>
    <title>XML AJAX Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="text-div">
<h2>Student Details</h2>

<button class="buttons" onclick="loadXML()">Load Students</button>

<div id="output"></div>
</div>
<script>
function loadXML() {

    var xhttp = new XMLHttpRequest();

    xhttp.onreadystatechange = function() {

        if (this.readyState == 4 && this.status == 200) {

            var xmlDoc = this.responseXML;
            var students = xmlDoc.getElementsByTagName("student");
            console.log(students);
            var output = "";

            for (var i = 0; i < students.length; i++) {

                var name = students[i]
                    .getElementsByTagName("name")[0]
                    .childNodes[0].nodeValue;

                var course = students[i]
                    .getElementsByTagName("course")[0]
                    .childNodes[0].nodeValue;

                output += "<p><b>Name:</b> " + name +
                          "<br><b>Course:</b> " + course + "</p>";
            }

            document.getElementById("output").innerHTML = output;
        }
    };

    xhttp.open("GET", "students.xml", true);
    xhttp.send();
}
</script>

</body>
</html>
