<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link rel='stylesheet' href='style.css'>
</head>
<body>
<div class='text-div'>
<button onclick="button_type(1)" class='button'>Odd Number</button>
<button onclick="button_type(2)" class='button'>Even Number</button>
<button onclick="button_type(3)" class='button'>Prime Number</button>
<button onclick="button_type(4)" class='button'>Fiboonacci Series</button>
</div>

<div class='text-div' id='result'>
<p id='function'></p>
</div>

<script>

function button_type(num){
let i,n
switch (num){


case 1:

n = window.prompt("Enter the number - ",0)
document.getElementById('function').innerHTML = 'ODD NUMBERS'
for(i=1;i<=n;i++){
if(i%2 != 0){
let p = document.createElement("p");
p.innerText = i;
document.getElementById("result").appendChild(p);
}
}
break


case 2:
document.getElementById('function').innerHTML = 'EVEN NUMBERS'
n = window.prompt("Enter the number - ",0)
for(i=1;i<=n;i++){
if(i%2 == 0){
let p = document.createElement("p");
p.innerText = i;
document.getElementById("result").appendChild(p);
}
}
break


case 3:
let j
document.getElementById('function').innerHTML = 'PRIME NUMBERS'
n = window.prompt("Enter the number - ",0)
for(j=1;j<=n;j++){
let count=0
for(i=1;i<=j;i++){
if(j%i == 0)
count++
}
if(count == 2){
let p = document.createElement("p");
p.innerText = j;
document.getElementById("result").appendChild(p);
}
}
break

case 4:
document.getElementById('function').innerHTML = 'FIBOONACCI SERIES'
n = window.prompt("Enter the number - ",0)
let a=0,b=1,c
for(i=0;i<n;i++){
if(i == 0){
let p = document.createElement("p");
p.innerText = a;
document.getElementById("result").appendChild(p);
}
else if(i==1){
let p = document.createElement("p");
p.innerText = b;
document.getElementById("result").appendChild(p);
}
else{
c = a+b
a = b
b = c
let p = document.createElement("p");
p.innerText = c;
document.getElementById("result").appendChild(p);
}
}
break
default:
console.log("exit")
break
}
}
    </script>
</body>
</html>
