        const date = new Date(document.lastModified);
        let myDomain = document.domain;
        let myUrl = document.URL;

        document.getElementsByClassName("text")[1].innerHTML = "<span class='text-1'>Domain :   </span>" + myDomain;
        document.getElementsByClassName("text")[2].innerHTML = "<span class='text-1'>URL :   </span>" + myUrl;
    </script>
</body>
