<html>
<head>
    <title>Practical 7</title>
    <link rel="stylesheet" href="style.css">
    </link>
</head>

<body>
    <div class="text-div">
        <h2> -- Fibonacchi series -- </h2>
        <br>
        <div id="div_main"></div>
    </div>
</body>
<script>
    let num,i,a=0,b=1,c;
    num = prompt("Enter the number - ",0)
    for(i=2;i<num;i++){
        if(i==2){
        document.getElementById("div_main").innerHTML += "<p class='text'>"+a+"</p>";
        document.getElementById("div_main").innerHTML += "<p class='text'>"+b+"</p>";
        }
        c = a+b;
        a = b;
        b = c;
        document.getElementById("div_main").innerHTML += "<p class='text'>"+c+"</p>";
    }
</script>
</html>
