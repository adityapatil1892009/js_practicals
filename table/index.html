<html>
<head>
    <title>Practical 6</title>
    <link rel="stylesheet" href="style.css">
    </link>
</head>

<body>
    <div class="text-div">
        <h2> -- Multiplication Table -- </h2>
        <br>
        <div id="div_main"></div>
    </div>
</body>
<script>
    let num,i;
    num = prompt("Enter the number - ",0)
    for(i=1;i<=10;i++){
        document.getElementById("div_main").innerHTML += "<p class='text'>"+num*i+"</p>";
    }
</script>
</html>
